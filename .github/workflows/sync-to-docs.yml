name: Sync Cookbook to Docs Site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "static/**"
      - ".github/workflows/sync-to-docs.yml"
  workflow_dispatch:

jobs:
  sync-cookbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cookbook repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: cookbook-repo

      - name: Checkout docs repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ secrets.DOCS_REPO_NAME || 'ppl-ai/api-docs' }}
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          ref: main
          path: docs-repo

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Install docs dependencies
        working-directory: docs-repo
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm install --frozen-lockfile

      - name: Mirror cookbook content
        run: |
          mkdir -p docs-repo/docs/cookbook
          rsync -a --delete cookbook-repo/docs/ docs-repo/docs/cookbook/
          mkdir -p docs-repo/docs/cookbook/static
          rsync -a --delete cookbook-repo/static/ docs-repo/docs/cookbook/static/

      - name: Configure git
        working-directory: docs-repo
        run: |
          git config --local user.email "cookbook-sync@perplexity.ai"
          git config --local user.name "Cookbook Sync Bot"

      - name: Commit source content before generation
        working-directory: docs-repo
        run: |
          git add docs/cookbook
          if git diff --staged --quiet; then
            echo "SOURCE_COMMIT_CREATED=false" >> "$GITHUB_ENV"
          else
            git commit -m "Sync cookbook from ${{ github.repository }}@${{ github.sha }}"
            echo "SOURCE_COMMIT_CREATED=true" >> "$GITHUB_ENV"
          fi

      - name: Generate cookbook navigation and gallery
        working-directory: docs-repo
        run: pnpm sync-cookbook

      - name: Commit and push generated content
        working-directory: docs-repo
        run: |
          changes_made=false
          git add config/navigation.json snippets/cookbookData.jsx
          if ! git diff --staged --quiet; then
            if [ "$SOURCE_COMMIT_CREATED" = "true" ]; then
              git commit --amend --no-edit
            else
              git commit -m "Regenerate cookbook navigation and gallery"
            fi
            changes_made=true
          elif [ "$SOURCE_COMMIT_CREATED" = "true" ]; then
            changes_made=true
          fi
          echo "CHANGES_MADE=$changes_made" >> "$GITHUB_ENV"

          if [ "$changes_made" = "true" ]; then
            git push origin HEAD:main
          fi

      - name: Log sync status
        if: always()
        run: |
          if [ "${{ env.CHANGES_MADE }}" = "true" ]; then
            echo "Cookbook content and generated navigation were synced."
          else
            echo "Cookbook content is already up to date."
          fi
